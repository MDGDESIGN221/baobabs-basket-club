<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Banc d'essai · Le Greffe</title>

<!-- =====================================================================
     BANC D'ESSAI DU GREFFE
     Le Greffe monté tout seul, sans l'administration autour.
     On y voit ce qu'on ne voit pas en lisant le code : les polices qui
     ne chargent pas, un aperçu à 0 x 0, un article qui déborde.

     Le banc n'est PAS l'admin : les jetons de couleur (--bg, --gold…)
     viennent d'ici, pas du socle. Chaque var() du Greffe porte un repli,
     mais on les repose ici pour que le rendu soit celui de l'admin.
     ===================================================================== -->
<link rel="stylesheet" href="/greffe/greffe.css">
<style>
  :root{
    --bg:#070E0A; --surface:#0E1811; --surface-2:#141F17; --surface-3:#1B2A20;
    --line:rgba(243,239,230,.07); --line-strong:rgba(243,239,230,.14);
    --text:#F4F1E9; --muted:#A9B2AB; --faint:#7E8A81;
    --gold:#46BF1D; --gold-bright:#5FE033; --gold-lit:#7DFF4F;
    --font-display:'Space Grotesk','Archivo',sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    display:grid; place-items:center; padding:24px;
  }
  .banc{ text-align:center; max-width:520px; }
  .banc h1{ font-family:var(--font-display); font-size:20px; font-weight:700; margin:0 0 8px 0; }
  .banc p{ color:var(--muted); font-size:13.5px; line-height:1.55; margin:0 0 18px 0; }
  .banc button{
    padding:11px 20px; border:0; border-radius:10px; cursor:pointer;
    background:var(--gold); color:#0A1B0D; font:inherit; font-weight:700; font-size:14px;
  }
  .banc button:hover{ background:var(--gold-lit); }
  .banc code{
    font-family:ui-monospace,Consolas,monospace; font-size:12px;
    background:var(--surface-2); padding:2px 6px; border-radius:5px; color:var(--muted);
  }
  #banc-etat{ margin-top:14px; font-size:12.5px; color:var(--faint); min-height:20px; }
  #banc-etat.ko{ color:#E2574C; }
</style>
</head>
<body>

<div class="banc">
  <h1>Banc d'essai du Greffe</h1>
  <p>
    Le Greffe se monte ici sans l'administration. Les ressources déposées
    (polices, cachet) sont les mêmes que dans l'admin : elles vivent dans
    <code>IndexedDB</code>, pour cette origine.
  </p>
  <button type="button" id="banc-ouvrir">Ouvrir le Greffe</button>
  <div id="banc-etat"></div>
</div>

<div id="greffe-host"></div>

<script>
(function () {
  'use strict';
  var etat = document.getElementById('banc-etat');
  var pret = false, enCours = false;

  function dire(t, ko) { etat.textContent = t || ''; etat.className = ko ? 'ko' : ''; }

  function charger() {
    if (window.BaobabsGreffe) return Promise.resolve();
    return fetch('/greffe/greffe.html', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('fragment ' + r.status); return r.text(); })
      .then(function (html) {
        var hote = document.getElementById('greffe-host');
        hote.innerHTML = html;
        // Surcouche plein écran : il lui faut être enfant direct de <body>,
        // sinon un ancêtre masqué annule le position:fixed et le Greffe
        // s'ouvre à 0 x 0, sans la moindre erreur en console.
        var el = hote.querySelector('#bgreffe');
        if (el) document.body.appendChild(el);
        return new Promise(function (res, rej) {
          var s = document.createElement('script');
          s.src = '/greffe/greffe.js';
          s.onload = function () { window.BaobabsGreffe ? res() : rej(new Error('global absent')); };
          s.onerror = function () { rej(new Error('greffe.js introuvable')); };
          document.head.appendChild(s);
        });
      });
  }

  document.getElementById('banc-ouvrir').addEventListener('click', function () {
    if (enCours) return;
    if (pret) { window.BaobabsGreffe.open(); return; }
    enCours = true; dire('Chargement…');
    charger()
      .then(function () {
        return window.BaobabsGreffe.mount(document.getElementById('bgreffe'), {
          onClose: function () { dire('Greffe fermé.'); }
        });
      })
      .then(function () {
        pret = true; enCours = false; dire('');
        window.BaobabsGreffe.open();
      })
      .catch(function (e) {
        enCours = false;
        dire('Échec : ' + (e && e.message ? e.message : e), true);
      });
  });
})();
</script>
</body>
</html>
