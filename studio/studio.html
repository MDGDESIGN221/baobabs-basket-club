<!-- =====================================================================
     BAOBABS STUDIO — fragment HTML
     Ni <html>, ni <head>, ni <body>, ni <link>, ni <script>.
     Racine unique #bstudio, toutes les classes préfixées bs-.
     Monté par window.BaobabsStudio.mount(root, api).
     ===================================================================== -->
<div id="bstudio" role="dialog" aria-modal="true" aria-label="Baobabs Studio" aria-hidden="true">

  <!-- ========================= ÉCRAN D'ACCUEIL =========================
       On n'arrive pas directement dans l'espace de travail : on choisit
       d'abord ce qu'on vient faire — reprendre, partir d'un modèle, ou
       poser des dimensions. -->
  <div class="bs-home" id="bs-home">
    <header class="bs-home-top">
      <div class="bs-logo">
        <span class="bs-logo-mark" id="bs-logo-mark"></span>
        <span class="bs-logo-word">Baobabs<em>Studio</em></span>
      </div>
      <div class="bs-home-top-r">
        <span class="bs-home-ver" id="bs-home-ver"></span>
        <button type="button" class="bs-ico bs-ico-close" id="bs-home-close" title="Quitter le Studio" aria-label="Quitter">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <div class="bs-home-body">
      <nav class="bs-home-rail">
        <button type="button" class="bs-btn bs-btn-accent bs-btn-block" data-home="nouveau-vite">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Nouveau projet
        </button>
        <button type="button" class="bs-btn bs-btn-ghost bs-btn-block" data-home="ouvrir-fichier">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4L10 7h9.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5Z"/></svg>
          Ouvrir un fichier…
        </button>
        <div class="bs-home-nav" id="bs-home-nav">
          <button type="button" class="bs-home-navi is-on" data-hscreen="accueil">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
            Accueil
          </button>
          <button type="button" class="bs-home-navi" data-hscreen="nouveau">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
            Nouveau
          </button>
          <button type="button" class="bs-home-navi" data-hscreen="modeles">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.6"/></svg>
            Modèles
          </button>
          <button type="button" class="bs-home-navi" data-hscreen="recents">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/></svg>
            Travaux récents
          </button>
        </div>
        <div class="bs-home-tip" id="bs-home-tip"></div>
      </nav>
      <main class="bs-home-main" id="bs-home-main"></main>
    </div>
  </div>

  <!-- ========================= ESPACE DE TRAVAIL ========================= -->
  <div class="bs-app" id="bs-app">

    <!-- ========================= BARRE DU HAUT ========================= -->
    <header class="bs-topbar">
      <div class="bs-topbar-l">
        <button type="button" class="bs-logo bs-logo-btn" id="bs-logo-home" title="Retour à l'accueil">
          <span class="bs-logo-mark" id="bs-logo-mark2"></span>
        </button>

        <nav class="bs-menubar" id="bs-menubar" aria-label="Menus"></nav>
      </div>

      <div class="bs-topbar-l bs-topbar-proj">
        <div class="bs-projbox">
          <span class="bs-proj-dot" id="bs-dirty-dot" title="Modifications non enregistrées"></span>
          <input type="text" id="bs-proj-name" class="bs-proj-name" value="Sans titre" aria-label="Nom du projet" spellcheck="false">
        </div>

        <label class="bs-inline-field">
          <select id="bs-format" class="bs-sel bs-sel-sm" aria-label="Format de l affiche"></select>
        </label>
      </div>

      <div class="bs-topbar-c">
        <button type="button" class="bs-ico" id="bs-undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M4 7H10.5C12.5 7 14 8.5 14 10.5C14 12.5 12.5 14 10.5 14H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6.5 4L4 7L6.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="bs-ico" id="bs-redo" title="Rétablir (Ctrl+Maj+Z)" aria-label="Rétablir">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M13 7H6.5C4.5 7 3 8.5 3 10.5C3 12.5 4.5 14 6.5 14H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10.5 4L13 7L10.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="bs-vsep bs-vsep-s"></div>
        <button type="button" class="bs-ico" id="bs-save" title="Enregistrer le projet (Ctrl+S)" aria-label="Enregistrer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        </button>
        <span class="bs-saveinfo" id="bs-saveinfo">Jamais enregistré</span>
      </div>

      <div class="bs-topbar-r">
        <button type="button" class="bs-btn bs-btn-ghost" id="bs-export">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1.5V9.5M7.5 9.5L4.5 6.5M7.5 9.5L10.5 6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11V12.5C2.5 13.05 2.95 13.5 3.5 13.5H11.5C12.05 13.5 12.5 13.05 12.5 12.5V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Exporter
        </button>
        <button type="button" class="bs-btn bs-btn-accent" id="bs-publish">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M3 2L11 6.5L3 11V2Z" fill="currentColor"/></svg>
          Publier
        </button>
        <button type="button" class="bs-btn bs-btn-ghost bs-btn-icon" id="bs-share" title="Copier le texte de publication">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="4" cy="8" r="1.9" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="3.5" r="1.9" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12.5" r="1.9" stroke="currentColor" stroke-width="1.4"/><path d="M5.7 7.1 10.3 4.4M5.7 8.9l4.6 2.7" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <div class="bs-vsep bs-vsep-s"></div>
        <button type="button" class="bs-ico" id="bs-help" title="Raccourcis clavier (?)" aria-label="Aide">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6"/><path d="M12 17.2h.01"/></svg>
        </button>
        <button type="button" class="bs-ico bs-ico-close" id="bs-close" title="Fermer le Studio (Échap)" aria-label="Fermer le Studio">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>

    <!-- ========================= ESPACE DE TRAVAIL ========================= -->
    <div class="bs-workspace">

      <!-- ---------- rail de gauche ---------- -->
      <nav class="bs-rail" id="bs-rail" aria-label="Panneaux">
        <button type="button" class="bs-rail-i is-on" data-panel="modeles" title="Modèles">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><rect x="2" y="2" width="6.5" height="6.5" rx="1.6" stroke="currentColor" stroke-width="1.4"/><rect x="10.5" y="2" width="6.5" height="6.5" rx="1.6" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="10.5" width="6.5" height="6.5" rx="1.6" stroke="currentColor" stroke-width="1.4"/><rect x="10.5" y="10.5" width="6.5" height="6.5" rx="1.6" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Modèles</span>
        </button>
        <button type="button" class="bs-rail-i" data-panel="images" title="Images">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><rect x="2" y="2.5" width="15" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="6.8" cy="7.3" r="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 13.5L6.5 10L9.5 12.5L13 8.5L16.5 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Images</span>
        </button>
        <button type="button" class="bs-rail-i" data-panel="unsplash" title="Photos Unsplash">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8.5 3.5h7v4h-7zM3.5 9.5h17v11h-17z" stroke-linejoin="round"/><circle cx="12" cy="15" r="3.2"/></svg>
          <span>Photos</span>
        </button>
        <button type="button" class="bs-rail-i" data-panel="elements" title="Éléments">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><circle cx="6.8" cy="6.8" r="4.3" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="10" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Éléments</span>
        </button>
        <button type="button" class="bs-rail-i" data-panel="texte" title="Texte">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M3 3.5H16M9.5 3.5V16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6.5 16H12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>Texte</span>
        </button>
        <button type="button" class="bs-rail-i" data-panel="donnees" title="Données du club">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><ellipse cx="9.5" cy="4.5" rx="6.5" ry="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 4.5v10c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5v-10" stroke="currentColor" stroke-width="1.4"/><path d="M3 9.5c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Données</span>
        </button>
        <button type="button" class="bs-rail-i" data-panel="styles" title="Styles">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><circle cx="9.5" cy="9.5" r="7.2" stroke="currentColor" stroke-width="1.4"/><circle cx="9.5" cy="9.5" r="3" fill="currentColor"/></svg>
          <span>Styles</span>
        </button>
        <div class="bs-rail-sp"></div>
        <button type="button" class="bs-rail-i" data-panel="projets" title="Mes projets">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M2.5 5.3C2.5 4.6 3.1 4 3.8 4H7.5L9 5.8H15.2C15.9 5.8 16.5 6.4 16.5 7.1V13.7C16.5 14.4 15.9 15 15.2 15H3.8C3.1 15 2.5 14.4 2.5 13.7V5.3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span>Projets</span>
        </button>
      </nav>

      <!-- ---------- panneau contextuel ---------- -->
      <aside class="bs-panel" id="bs-panel" aria-label="Panneau d outils">
        <div class="bs-panel-body" id="bs-panel-body"></div>
      </aside>

      <!-- ---------- scène ---------- -->
      <main class="bs-stage-wrap">

        <div class="bs-toolbar" id="bs-toolbar">
          <div class="bs-tgroup" role="toolbar" aria-label="Outils">
            <button type="button" class="bs-tool is-on" data-tool="select" title="Sélection (V)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m4 3 7.5 18 2.5-7.5L21.5 11 4 3Z"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="node" title="Sélection directe — points de tracé (A)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m6 2 6 17 2.2-6.8L21 10 6 2Z"/><rect x="2" y="17.5" width="4.5" height="4.5" rx="1" fill="currentColor" stroke="none"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="hand" title="Main — déplacer la vue (H, ou Espace)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6.5a1.5 1.5 0 0 0-3 0V11M15 10.5V4.5a1.5 1.5 0 0 0-3 0V11M12 10.5V5.5a1.5 1.5 0 0 0-3 0V13M9 12V8.5a1.5 1.5 0 0 0-3 0V15c0 3.9 2.7 6.5 6.5 6.5S18 19 18 15v-3"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="zoom" title="Zoom (Z) — Alt pour dézoomer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M20 20l-4.5-4.5M7.5 10.5h6"/></svg>
            </button>
          </div>

          <div class="bs-vsep bs-vsep-s"></div>

          <div class="bs-tgroup">
            <button type="button" class="bs-tool" data-tool="text" title="Texte (T)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 5h16M12 5v14M8.5 19h7"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="pen" title="Plume — tracé Bézier (P)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c0-8 5-13 13-13"/><path d="m14.5 5.5 4-2.5 2.5 4-2.5 4-4-5.5Z"/><circle cx="3.4" cy="20.6" r="1.5" fill="currentColor" stroke="none"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="rect" title="Rectangle (R)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="ellipse" title="Ellipse (O)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="line" title="Ligne (L) — Maj pour contraindre">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20 20 4"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="frame" title="Cadre photo — objet dynamique (F)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke-dasharray="3.2 2.4"/><path d="m6 16 4-4.5 3 3 3-3.5 3 5"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="eyedrop" title="Pipette (I)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m18.5 2.5 3 3-8 8-3-3 8-8Z"/><path d="M11 8 3.5 15.5V20.5h5L16 13"/></svg>
            </button>
          </div>

          <div class="bs-vsep bs-vsep-s"></div>

          <!-- détourage : les trois outils qui découpent une image -->
          <div class="bs-tgroup">
            <button type="button" class="bs-tool" data-tool="wand" title="Baguette magique — détourer un fond uni (W)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6 4 4L8 20l-4-4Z"/><path d="M17 3.5 18 6l2.5 1-2.5 1-1 2.5-1-2.5L13.5 7 16 6Z"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="erase" title="Gomme de masque — effacer une zone (E)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 15.5 7-7a2 2 0 0 1 2.8 0l4.2 4.2a2 2 0 0 1 0 2.8l-4.5 4.5H8Z"/><path d="M21 21H9"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="restore" title="Pinceau de masque — restaurer une zone (B)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5 4 20l2.5.5.5 2.5 5.5-5.5"/><path d="m11 12.5 7.5-7.5a2.1 2.1 0 0 1 3 3L14 15.5Z"/></svg>
            </button>
            <button type="button" class="bs-tool" data-tool="crop" title="Recadrer l affiche (C)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 2v16h16M2 6h16v16"/></svg>
            </button>
          </div>

          <!-- réglages de l'outil courant, remplis par setTool() -->
          <div class="bs-tool-opts" id="bs-tool-opts"></div>

          <div class="bs-tgroup bs-tgroup-r">
            <button type="button" class="bs-tbtn" id="bs-add-image" title="Insérer une image">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 5-5.5 3.5 3.5L16 11l4 5.5"/></svg>
              <span>Image</span>
            </button>
            <button type="button" class="bs-tbtn" id="bs-add-logo" title="Insérer le logo du club">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5S6.5 7 6.5 12c0 2.4 1.4 4.5 3.5 5.5v3.5h4V17.5c2.1-1 3.5-3.1 3.5-5.5 0-5-5.5-9.5-5.5-9.5Z"/></svg>
              <span>Logo</span>
            </button>
            <div class="bs-vsep bs-vsep-s"></div>
            <button type="button" class="bs-tbtn" id="bs-dup" title="Dupliquer (Ctrl+D)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="3.5" width="12" height="12" rx="2"/><path d="M8 20.5h10a2.5 2.5 0 0 0 2.5-2.5V8"/></svg>
              <span>Dupliquer</span>
            </button>
            <button type="button" class="bs-tbtn bs-tbtn-danger" id="bs-del" title="Supprimer (Suppr)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M9 6.5V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5v2M17.5 6.5V19a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V6.5"/></svg>
              <span>Supprimer</span>
            </button>
          </div>
        </div>

        <div class="bs-viewport" id="bs-viewport">
          <div class="bs-ruler-corner"></div>
          <canvas class="bs-ruler bs-ruler-h" id="bs-ruler-h"></canvas>
          <canvas class="bs-ruler bs-ruler-v" id="bs-ruler-v"></canvas>
          <div class="bs-scene" id="bs-scene">
            <canvas id="bs-canvas"></canvas>
            <canvas id="bs-overlay"></canvas>
            <textarea id="bs-ime" class="bs-ime" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" tabindex="-1" aria-label="Saisie de texte"></textarea>
            <div class="bs-float" id="bs-float" role="toolbar" aria-label="Actions sur la sélection"></div>
          </div>
          <div class="bs-drop-hint" id="bs-drop-hint"><span>Déposez vos images ici</span></div>
        </div>

        <div class="bs-statusbar">
          <div class="bs-status-l">
            <button type="button" class="bs-chipbtn" id="bs-tgl-grid" title="Afficher la grille">Grille</button>
            <button type="button" class="bs-chipbtn is-on" id="bs-tgl-snap" title="Magnétisme et repères d alignement">Magnétisme</button>
            <button type="button" class="bs-chipbtn is-on" id="bs-tgl-safe" title="Marges de sécurité et repères">Marges</button>
            <button type="button" class="bs-chipbtn" id="bs-tgl-preview" title="Aperçu propre, sans repères ni poignées (touche P majuscule)">Aperçu</button>
          </div>
          <div class="bs-status-c">
            <span id="bs-status-dims">—</span>
            <span class="bs-status-sep">/</span>
            <span id="bs-status-pos">—</span>
          </div>
          <div class="bs-zoombox">
            <button type="button" class="bs-zbtn" id="bs-zoom-out" aria-label="Dézoomer">−</button>
            <button type="button" class="bs-zval" id="bs-zoom-val" title="Cliquer pour revenir à 100 %">100 %</button>
            <button type="button" class="bs-zbtn" id="bs-zoom-in" aria-label="Zoomer">+</button>
            <div class="bs-vsep bs-vsep-s"></div>
            <button type="button" class="bs-zbtn" id="bs-zoom-fit" title="Ajuster à l écran (Ctrl+0)">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 5V2C1 1.4 1.4 1 2 1H5M9 1H12C12.6 1 13 1.4 13 2V5M13 9V12C13 12.6 12.6 13 12 13H9M5 13H2C1.4 13 1 12.6 1 12V9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
      </main>

      <!-- ---------- colonne de droite ---------- -->
      <aside class="bs-right">
        <div class="bs-props" id="bs-props"><div class="bs-props-body" id="bs-props-body"></div></div>
        <div class="bs-layers">
          <div class="bs-layers-head">
            <span class="bs-layers-title">Calques</span>
            <div class="bs-layers-acts">
              <button type="button" class="bs-ico bs-ico-xs" id="bs-lyr-group" title="Grouper / dégrouper (Ctrl+G)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4"/><rect x="8.5" y="8.5" width="7" height="7" rx="1"/></svg>
              </button>
              <button type="button" class="bs-ico bs-ico-xs" id="bs-lyr-up" title="Monter (Ctrl+])">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg>
              </button>
              <button type="button" class="bs-ico bs-ico-xs" id="bs-lyr-down" title="Descendre (Ctrl+[)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m6 10 6 6 6-6"/></svg>
              </button>
              <button type="button" class="bs-ico bs-ico-xs bs-ico-danger" id="bs-lyr-del" title="Supprimer le calque">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M9 6.5V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5v2M17.5 6.5V19a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V6.5"/></svg>
              </button>
            </div>
          </div>
          <div class="bs-layer-list" id="bs-layer-list" role="tree" aria-label="Pile des calques"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- champs et surcouches utilitaires -->
  <input type="file" id="bs-file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/avif" multiple hidden>
  <input type="file" id="bs-file-json" accept="application/json,.json" hidden>
  <div class="bs-menu-pop" id="bs-menu-pop" role="menu"></div>
  <div class="bs-ctxmenu" id="bs-ctxmenu" role="menu"></div>
  <div class="bs-modal" id="bs-modal" aria-hidden="true">
    <div class="bs-modal-card" id="bs-modal-card" role="dialog" aria-modal="true"></div>
  </div>
  <div class="bs-toast" id="bs-toast" role="status" aria-live="polite"></div>
</div>
