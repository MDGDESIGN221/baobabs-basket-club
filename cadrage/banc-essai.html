<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Banc d'essai — Cadrage</title>
<!-- Page de test autonome. NON livrée en production : elle ne sert qu'à
     ouvrir l'atelier sans passer par l'administration ni par Supabase. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cadrage/cadrage.css">
<style>
  body{ margin:0; padding:32px; background:#07130D; color:#F3EFE6;
        font-family:'Inter',system-ui,sans-serif; }
  h1{ font-size:19px; margin:0 0 6px; }
  p{ color:#93A099; font-size:13px; max-width:60ch; line-height:1.6; }
  .rangee{ display:flex; gap:10px; flex-wrap:wrap; margin:22px 0; }
  button{ cursor:pointer; font-family:inherit; font-weight:600; font-size:13px;
          padding:10px 16px; border-radius:10px;
          border:1px solid rgba(198,162,87,.5); background:none; color:#C6A257; }
  button:hover{ background:rgba(198,162,87,.12); }
  pre{ background:#0A150F; border:1px solid rgba(243,239,230,.1); border-radius:12px;
       padding:16px; font-family:'JetBrains Mono',monospace; font-size:12px;
       color:#A8D93B; overflow:auto; }
  .apercu{ margin-top:20px; display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  .apercu figure{ margin:0; }
  .apercu figcaption{ font-size:11px; color:#7E8A82; margin-top:6px; text-align:center; }
  .boite{ position:relative; overflow:hidden; border-radius:12px;
          border:1px solid rgba(198,162,87,.3); background:#050D08; }
  .boite img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .bb-cadre{ --cc-x:var(--cx,50%); --cc-y:var(--cy,50%); --cc-z:var(--cz,1); }
  @media(max-width:768px){
    .bb-cadre{ --cc-x:var(--mcx,var(--cx,50%)); --cc-y:var(--mcy,var(--cy,50%)); --cc-z:var(--mcz,var(--cz,1)); }
  }
</style>
</head>
<body>
  <h1>Banc d'essai — Cadrage</h1>
  <p>Ouvre l'atelier hors de l'administration. Les deux cadres du bas montrent
     le résultat exactement comme le site l'appliquera : le même CSS, les
     mêmes variables.</p>

  <div class="rangee">
    <button data-essai="hero">Hero (0.97 / 0.79)</button>
    <button data-essai="poster">Image d'attente (0.56 / 0.56)</button>
    <button data-essai="faceoff">Face-Off (1.61 / 0.70)</button>
  </div>

  <pre id="sortie">Aucun cadrage validé pour l'instant.</pre>

  <div class="apercu">
    <figure><div class="boite" id="ap-d"><img id="ap-d-img" alt=""></div><figcaption>Cadre ordinateur</figcaption></figure>
    <figure><div class="boite" id="ap-m"><img id="ap-m-img" alt=""></div><figcaption>Cadre téléphone</figcaption></figure>
  </div>

  <div id="bcadrage"></div>

<!-- Anti-cache : sur un banc d'essai, relire la version d'il y a dix minutes
     fait chercher des bugs déjà corrigés. En production, le script est
     chargé normalement par l'administration. -->
<script>document.write('<scr'+'ipt src="/cadrage/cadrage.js?v='+Date.now()+'"><\/scr'+'ipt>');</script>
<script>
(function(){
  var ESSAIS = {
    hero:    { url:'/media/img/Person_on_basketball_court_2K_202607220359_qdn8q9.webp', titre:'Image du hero', d:0.97, m:0.79 },
    poster:  { url:'/media/video/detection-2026-07-poster.webp', titre:'Détection — image d\'attente', d:0.56, m:0.56 },
    faceoff: { url:'/media/img/nouvel_num_4_umsjcf.webp', titre:'Face-Off — photo de gauche', d:1.61, m:0.70 }
  };
  var memoire = {};   // tient lieu de site_settings

  window.BaobabsCadrage.monter(document.getElementById('bcadrage'));

  function peindreApercu(conf, v){
    [['d', conf.d, v.x, v.y, v.zoom], ['m', conf.m,
      (v.mx==null||v.mx===''?v.x:v.mx), (v.my==null||v.my===''?v.y:v.my), (v.mzoom==null||v.mzoom===''?v.zoom:v.mzoom)]]
    .forEach(function(p){
      var boite = document.getElementById('ap-'+p[0]);
      var img = document.getElementById('ap-'+p[0]+'-img');
      var l = 220, h = l / p[1];
      boite.style.width = Math.round(l)+'px';
      boite.style.height = Math.round(h)+'px';
      img.src = conf.url;
      img.classList.add('bb-cadre');
      img.style.setProperty('--cx', p[2]+'%');
      img.style.setProperty('--cy', p[3]+'%');
      img.style.setProperty('--cz', p[4]/100);
      img.style.objectPosition  = 'var(--cc-x) var(--cc-y)';
      img.style.transform       = 'scale(var(--cc-z))';
      img.style.transformOrigin = 'var(--cc-x) var(--cc-y)';
    });
  }

  document.querySelectorAll('[data-essai]').forEach(function(b){
    b.addEventListener('click', function(){
      var nom = b.getAttribute('data-essai'), conf = ESSAIS[nom];
      window.BaobabsCadrage.ouvrir({
        url: conf.url, titre: conf.titre, ratioD: conf.d, ratioM: conf.m,
        valeurs: memoire[nom] || {},
        onValider: function(v){
          memoire[nom] = v;
          document.getElementById('sortie').textContent =
            nom + ' → ' + JSON.stringify(v, null, 1);
          peindreApercu(conf, v);
        }
      });
    });
  });

  // Pour piloter le banc depuis la console ou un test automatisé.
  window.bancCadrage = { essais: ESSAIS, memoire: memoire, peindre: peindreApercu };
})();
</script>
</body>
</html>
