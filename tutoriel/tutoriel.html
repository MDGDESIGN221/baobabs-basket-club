<!-- =====================================================================
     TUTORIEL DE L'ADMINISTRATION — fragment
     Chargé à la première ouverture par tutorielCharger(), puis déplacé
     en enfant direct de <body> : #btut est une surcouche plein écran,
     et position:fixed ne survit pas à un ancêtre en display:none.
     ===================================================================== -->
<div id="btut" class="hide" role="dialog" aria-modal="true" aria-label="Tutoriel de l'administration">

  <!-- ============ LE SOMMAIRE ============ -->
  <div class="bt-somm" id="bt-somm">
    <div class="bt-in">

      <header class="bt-head">
        <div>
          <div class="bt-kick">Tutoriel</div>
          <h1 class="bt-h1">L'administration, écran par écran</h1>
          <p class="bt-sub" id="bt-sub">Chargement…</p>
        </div>
        <button type="button" class="bt-x" id="bt-fermer" aria-label="Fermer le tutoriel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="bt-cmds">
        <button type="button" class="bt-cta" id="bt-tout">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Tout me montrer
        </button>
        <button type="button" class="bt-ghost hide" id="bt-reprendre"></button>
        <label class="bt-voix" id="bt-voix">
          <input type="checkbox" id="bt-voix-case">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <span id="bt-voix-txt">Lire à voix haute</span>
        </label>
        <button type="button" class="bt-anim-cmd hide" id="bt-anim-cmd"></button>
        <select class="bt-voix-liste hide" id="bt-voix-liste" aria-label="Choisir la voix"></select>
        <button type="button" class="bt-voix-essai hide" id="bt-voix-essai">Écouter</button>
        <p class="bt-voix-note" id="bt-voix-note"></p>
      </div>

      <div class="bt-jauge"><i id="bt-jauge"></i></div>
      <p class="bt-jauge-txt" id="bt-jauge-txt"></p>

      <div class="bt-chaps" id="bt-chaps"></div>

      <div class="bt-pied">
        <button type="button" class="bt-oublier" id="bt-oublier">Oublier ma progression</button>
        <p class="bt-etat" id="bt-etat"></p>
      </div>

    </div>
  </div>

  <!-- ============ L'AIDE DU CONTEXTE ============
       Ce panneau part de l'écran où l'on se trouve. Il ne remplace pas
       le sommaire : il répond à une autre question. Le sommaire dit
       « qu'est-ce que je dois apprendre » ; celui-ci dit « je suis ici,
       qu'est-ce que je peux faire ici ». -->
  <div class="bt-ctx hide" id="bt-ctx">
    <div class="bt-ctx-in">
      <header class="bt-ctx-head">
        <div>
          <div class="bt-kick" id="bt-ctx-ou">Aide</div>
          <h2 class="bt-ctx-t" id="bt-ctx-t">…</h2>
          <p class="bt-ctx-s" id="bt-ctx-s"></p>
        </div>
        <button type="button" class="bt-x" id="bt-ctx-fermer" aria-label="Fermer l'aide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <p class="bt-ctx-q">Que voulez-vous faire&nbsp;?</p>
      <div class="bt-ctx-choix" id="bt-ctx-choix"></div>

      <!-- La réponse s'ouvre ICI, sous la question. On ne quitte pas
           l'écran pour lire qui y a accès. -->
      <div class="bt-ctx-rep hide" id="bt-ctx-rep"></div>
    </div>
  </div>

  <!-- ============ LE BAC A SABLE ============
       Ici, on manipule pour de vrai — et rien de ce qu'on fait n'existe
       ailleurs. Ce ne sont pas les données du club : ce sont des cartes
       et des champs qui n'appartiennent qu'à cet exercice. Aucune
       requête ne part, aucune ligne n'est écrite. C'est ce qui permet
       d'oser un geste qu'on n'oserait pas sur le vrai écran. -->
  <div class="bt-bac hide" id="bt-bac">
    <div class="bt-bac-in">
      <header class="bt-bac-head">
        <div>
          <div class="bt-kick">Exercice</div>
          <h2 class="bt-bac-t" id="bt-bac-t">À vous</h2>
          <p class="bt-bac-s" id="bt-bac-s"></p>
        </div>
        <button type="button" class="bt-x" id="bt-bac-fermer" aria-label="Fermer l'exercice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="bt-bac-corps" id="bt-bac-corps"></div>

      <div class="bt-bac-pied">
        <div class="bt-bac-score" id="bt-bac-score"></div>
        <div class="bt-bac-cmd">
          <button type="button" class="bt-ghost" id="bt-bac-rejouer">Recommencer</button>
          <button type="button" class="bt-cta" id="bt-bac-suivant">Exercice suivant</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ LE HALO ET LA MAIN ============ -->
  <!-- Le halo porte son propre cadre : un trait qui SE DESSINE autour de
       la chose. Un rectangle qui apparaît d'un coup ne raconte rien ;
       un trait qui se referme dit « celle-ci, et pas une autre ». -->
  <div class="bt-spot hide" id="bt-spot">
    <svg class="bt-spot-svg" id="bt-spot-svg" aria-hidden="true">
      <rect id="bt-spot-rect" x="2" y="2" rx="11" ry="11"/>
    </svg>
  </div>

  <!-- Le trait qui relie ce qu'on dit à ce qu'on montre. Sans lui, deux
       objets vivent chacun de leur côté sur l'écran. -->
  <svg class="bt-fil hide" id="bt-fil" aria-hidden="true"><path id="bt-fil-p"/></svg>

  <!-- L'onde du clic : elle part du point touché. -->
  <div class="bt-clic" id="bt-clic" aria-hidden="true"></div>

  <!-- Le pointeur. Deux traces : le corps de la fleche, puis un reflet
       le long de l'arete gauche qui lui donne du relief. La pointe est
       en 5.5,2.5 -- c'est elle qu'on cale sur la cible, pas le coin du
       cadre (voir la marge negative dans la CSS). -->
  <div class="bt-doigt hide" id="bt-doigt" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path class="bt-doigt-c" d="M5.5 2.5 L5.5 19.8 L10 15.5 L12.7 21.6 L15.7 20.2 L13 14.2 L18.6 13.9 Z"/>
      <path class="bt-doigt-r" d="M6.9 5.9 L6.9 16.6 L9.7 13.9 Z"/>
    </svg>
  </div>

  <!-- Le clavier fantôme : il n'apparaît que pendant une saisie, et les
       touches s'allument au rythme des lettres. On voit qu'on TAPE. -->
  <div class="bt-clav hide" id="bt-clav" aria-hidden="true">
    <div class="bt-clav-r" data-r="azertyuiop"></div>
    <div class="bt-clav-r" data-r="qsdfghjklm"></div>
    <div class="bt-clav-r" data-r="wxcvbn"></div>
    <div class="bt-clav-b" id="bt-clav-b"></div>
  </div>

  <!-- LA CARTE DE CHAPITRE : UNE RESPIRATION, ET UN EFFET D'ANNONCE.
       Elle etait sobre — un surtitre, un titre, une ligne. Devant une
       salle, cette sobriete devient de la monotonie : quarante-quatre
       ecrans annonces de la meme facon, et l'attention part avant le
       dixieme. On y ajoute donc trois choses qui ne coutent rien a la
       lecture et beaucoup a l'ennui :
         · le NUMERO DU CHAPITRE en tres grand, en reserve derriere le
           titre — on sait ou l'on en est sans compter ;
         · un FILET OR qui se trace sous le surtitre, comme un trait
           qu'on tire au tableau avant d'ecrire ;
         · une ENTREE DECALEE : le surtitre, puis le titre, puis la
           ligne du dessous. Trois choses qui arrivent ensemble sont un
           bloc ; trois choses qui arrivent l'une apres l'autre sont une
           phrase. -->
  <div class="bt-carte hide" id="bt-carte" aria-hidden="true">
    <div class="bt-carte-in">
      <!-- Le chiffre est DANS le bloc de texte, et non dans la carte :
           c'est la seule facon qu'ils partagent un centre. Pose dans la
           carte, il se calait sur le milieu de la fenetre pendant que le
           texte se calait sur le milieu de l'espace restant -- deux
           centres pour une seule composition, qu'aucune correction
           chiffree ne rattrape d'un ecran a l'autre. -->
      <div class="bt-carte-fond" id="bt-carte-fond" aria-hidden="true"></div>
      <div class="bt-carte-n" id="bt-carte-n"></div>
      <div class="bt-carte-fil"></div>
      <div class="bt-carte-t" id="bt-carte-t"></div>
      <div class="bt-carte-s" id="bt-carte-s"></div>
    </div>
  </div>

  <!-- ============ LE NARRATEUR ============ -->
  <div class="bt-narr hide" id="bt-narr">
    <div class="bt-narr-j"><i id="bt-narr-j"></i></div>
    <div class="bt-narr-in">
      <div class="bt-demo">
        <span class="bt-demo-pt"></span>
        <span id="bt-demo-txt"></span>
      </div>
      <div class="bt-pause hide" id="bt-pause">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        Vous explorez l'administration — le guide vous attend.
      </div>
      <div class="bt-ou" id="bt-ou"></div>
      <div class="bt-dit" id="bt-dit"></div>
      <div class="bt-cmd">
        <button type="button" class="bt-b" id="bt-prec" title="Étape précédente" aria-label="Étape précédente">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button type="button" class="bt-b bt-b-play" id="bt-play" aria-label="Pause">
          <svg viewBox="0 0 24 24" fill="currentColor" id="bt-play-i"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          <span id="bt-play-t">Pause</span>
        </button>
        <button type="button" class="bt-b" id="bt-suiv" title="Étape suivante" aria-label="Étape suivante">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
        <button type="button" class="bt-b" id="bt-voix2" title="Lire à voix haute" aria-label="Lire à voix haute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
        <span class="bt-esp"></span>
        <button type="button" class="bt-lien" id="bt-somm-retour">Sommaire</button>
        <button type="button" class="bt-b" id="bt-quitter" title="Fermer le tutoriel" aria-label="Fermer le tutoriel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>
