<!-- =====================================================================
     TUTORIEL DE L'ADMINISTRATION — fragment
     Chargé à la première ouverture par tutorielCharger(), puis déplacé
     en enfant direct de <body> : #btut est une surcouche plein écran,
     et position:fixed ne survit pas à un ancêtre en display:none.
     ===================================================================== -->
<div id="btut" class="hide" role="dialog" aria-modal="true" aria-label="Tutoriel de l'administration">

  <!-- ============ LE SOMMAIRE ============ -->
  <div class="bt-somm" id="bt-somm">
    <div class="bt-in">

      <header class="bt-head">
        <div>
          <div class="bt-kick">Tutoriel</div>
          <h1 class="bt-h1">L'administration, écran par écran</h1>
          <p class="bt-sub" id="bt-sub">Chargement…</p>
        </div>
        <button type="button" class="bt-x" id="bt-fermer" aria-label="Fermer le tutoriel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="bt-cmds">
        <button type="button" class="bt-cta" id="bt-tout">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Tout me montrer
        </button>
        <button type="button" class="bt-ghost hide" id="bt-reprendre"></button>
        <label class="bt-voix" id="bt-voix">
          <input type="checkbox" id="bt-voix-case">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <span id="bt-voix-txt">Lire à voix haute</span>
        </label>
        <p class="bt-voix-note" id="bt-voix-note"></p>
      </div>

      <div class="bt-jauge"><i id="bt-jauge"></i></div>
      <p class="bt-jauge-txt" id="bt-jauge-txt"></p>

      <div class="bt-chaps" id="bt-chaps"></div>

      <div class="bt-pied">
        <button type="button" class="bt-oublier" id="bt-oublier">Oublier ma progression</button>
      </div>

    </div>
  </div>

  <!-- ============ LE HALO ============ -->
  <div class="bt-spot hide" id="bt-spot"></div>

  <!-- ============ LE NARRATEUR ============ -->
  <div class="bt-narr hide" id="bt-narr">
    <div class="bt-narr-j"><i id="bt-narr-j"></i></div>
    <div class="bt-narr-in">
      <div class="bt-ou" id="bt-ou"></div>
      <div class="bt-dit" id="bt-dit"></div>
      <div class="bt-cmd">
        <button type="button" class="bt-b" id="bt-prec" title="Étape précédente" aria-label="Étape précédente">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button type="button" class="bt-b bt-b-play" id="bt-play" aria-label="Pause">
          <svg viewBox="0 0 24 24" fill="currentColor" id="bt-play-i"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          <span id="bt-play-t">Pause</span>
        </button>
        <button type="button" class="bt-b" id="bt-suiv" title="Étape suivante" aria-label="Étape suivante">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
        <button type="button" class="bt-b" id="bt-voix2" title="Lire à voix haute" aria-label="Lire à voix haute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
        <span class="bt-esp"></span>
        <button type="button" class="bt-lien" id="bt-somm-retour">Sommaire</button>
        <button type="button" class="bt-b" id="bt-quitter" title="Fermer le tutoriel" aria-label="Fermer le tutoriel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>
