# Baobabs Basket Club — projet Supabase
#
# Ce fichier sert UNIQUEMENT à dire au CLI de quel projet on parle, pour
# que « supabase functions deploy » n'ait pas à le redemander à chaque
# fois. Il ne contient aucun secret : project_id est la référence
# publique du projet, celle qu'on lit déjà dans l'adresse de l'API.
project_id = "lmwbwasupqkvswukieav"

[functions.envoi-newsletter]
verify_jwt = true

[functions.confirmation-reservation]
# Appelée par le site public au moment d'une réservation : le visiteur
# n'est pas connecté, il n'y a donc pas de jeton à vérifier.
verify_jwt = false

[functions.alerte-inscription]
# Même chose : c'est le formulaire d'inscription du site qui la déclenche.
verify_jwt = false

[functions.aide-redaction]
verify_jwt = true
