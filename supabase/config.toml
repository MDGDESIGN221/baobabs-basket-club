# Baobabs Basket Club — projet Supabase
#
# Ce fichier sert UNIQUEMENT à dire au CLI de quel projet on parle, pour
# que « supabase functions deploy » n'ait pas à le redemander à chaque
# fois. Il ne contient aucun secret : project_id est la référence
# publique du projet, celle qu'on lit déjà dans l'adresse de l'API.
project_id = "lmwbwasupqkvswukieav"

[functions.envoi-newsletter]
verify_jwt = true

[functions.confirmation-reservation]
# Appelée par le site public au moment d'une réservation : le visiteur
# n'est pas connecté, il n'y a donc pas de jeton à vérifier.
verify_jwt = false

[functions.alerte-inscription]
# Même chose : c'est le formulaire d'inscription du site qui la déclenche.
verify_jwt = false

[functions.depot-piece]
# La famille depose le certificat medical depuis son telephone, sans
# compte : il n'y a aucun jeton a verifier. La fonction s'authentifie
# elle-meme sur le couple reference + telephone, et bbc_piece_deposer
# refait la meme verification derriere elle.
#
# Sans ce bloc, verify_jwt vaut true par defaut : la fonction serait
# deployee et refuserait les appels du site.
verify_jwt = false

[functions.aide-redaction]
verify_jwt = true

[functions.depot-photo]
# La candidate depose sa photo depuis son telephone, sans compte : il n'y
# a aucun jeton de session a verifier. Pour la collecte, la fonction
# verifie elle-meme le jeton de campagne ou de reprise aupres de la base ;
# pour la candidature, il n'y a rien a verifier -- la photo part avant que
# la candidature existe -- et c'est le controle des octets plus le debit
# par adresse qui tiennent.
#
# Sans ce bloc, verify_jwt vaut true par defaut : la fonction serait
# deployee et refuserait les appels du site.
verify_jwt = false
